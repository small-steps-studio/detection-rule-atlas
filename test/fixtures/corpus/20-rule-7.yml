title: Encoded Command 70
id: e106ff81-5b93-ad6d-a7a3-703d84782fc6
status: wip
description: Invented detection 70
date: 2026-02-11
tags:
    - attack.credential_access
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '\cmd.exe'
        CommandLine|contains: ' -enc '
    filter_admin:
        User|contains: SYSTEM
    condition: selection and not filter_admin
level: high
