title: Credential Dump 82
id: 9576a378-c1d2-20f7-aaac-eee69b985308
status: experimental
description: Invented detection 82
author: Example Team
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: ' -enc '
    filter_admin:
        User|contains: SYSTEM
    condition: selection
falsepositives:
    - Administrative tools
level: medium
