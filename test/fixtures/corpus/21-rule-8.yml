title: Encoded Command 81
id: 1e2a426f-aa91-ebf7-430b-3694e5b97fff
status: test
description: Invented detection 81
tags:
    - attack.persistence
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'ab'
    filter_admin:
        User|contains: SYSTEM
    condition: selection and not filter_admin
level: severe
