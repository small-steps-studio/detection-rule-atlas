title: Suspicious Process 50
status: stable
author: Example Team
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '*'
        CommandLine|contains: '-e'
    filter_admin:
        User|contains: SYSTEM
    condition: selection and not filter
level: critical
