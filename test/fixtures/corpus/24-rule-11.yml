title: New Service 111
id: 4f8aaf4a-5721-68e4-5c05-25ea9a65c59f
status: test
author: Example Team
date: 11.02.2026
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: file_event
    product: linux
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: '-e'
    filter_admin:
        User|contains: SYSTEM
    condition: 1 of selection*
falsepositives:
    - Administrative tools
level: medium
