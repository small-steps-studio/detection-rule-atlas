title: Encoded Command 110
id: rule-110
status: experimental
author: Example Team
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: ' -enc '
    condition: selection and not filter
falsepositives:
    - Administrative tools
level: low
